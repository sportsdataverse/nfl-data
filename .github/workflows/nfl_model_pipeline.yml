# NFL Model Pipeline — one CI job per numbered model stage + opt-in publish
#
# One model = one job: the matrix runs the numbered per-model pipelines in
# python/ (nfl_model_NN_<model>.py, flat — thin entries over the
# shared model_training package). The stage list's single home is
# models/manifest.yaml; tests/test_model_manifest.py keeps this matrix honest
# (a stage added there without a manifest row goes red).
#
# Each stage fingerprints hash(code subtree, config) and appends a line to
# models/ledger.jsonl on the runner (this workflow has contents: read, so CI
# ledger lines travel in the uploaded run artifact, not in git; local retrains
# commit theirs).
#
# The sparse annual cron exercises every stage once a year — a trainer that has
# not run in 12 months is an unknown, not an asset. Publish stays opt-in: an
# unattended run must not overwrite released models.
#
# Publishing routes decision models through `decision_models-artifacts`
# (DECISION_MODELS_RELEASE_MAP: fd + nfl4th WP -> nfl_4th_down_models, rest ->
# nfl_model_artifacts). Do NOT replace it with the generic `artifacts`
# subcommand — that would put every file on one tag.

name: NFL Model Pipeline

on:
  workflow_dispatch:
    inputs:
      stages:
        description: 'Stage selectors, space-separated (numbers 01-11 or model names, e.g. "01 05 fg"); empty = all stages'
        required: false
        default: ''
      publish:
        description: 'Publish retrained artifacts to the sportsdataverse-data releases (default OFF — a retrain that silently replaces released models is not reversible)'
        required: false
        type: boolean
        default: false
      nrounds:
        description: 'Override XGBoost nrounds for the decision stages (06-11) — set small (e.g. 20) for a smoke run'
        required: false
        default: ''
  schedule:
    # 06:00 UTC on 1 March — after the Super Bowl and after nflverse has
    # settled the final season's data. Deliberately annual.
    - cron: '0 6 1 3 *'

concurrency:
  group: nfl-model-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        stage:
          - nfl_model_01_ep
          - nfl_model_02_wp_spread
          - nfl_model_03_wp_naive
          - nfl_model_04_cp
          - nfl_model_05_xyac
          - nfl_model_06_xpass
          - nfl_model_07_fd
          - nfl_model_08_two_pt
          - nfl_model_09_fg
          - nfl_model_10_wp
          - nfl_model_11_punt

    steps:
      # Selector match in bash (accepts stage numbers, model names, or full
      # stage names). Env-passed, never ${{ }}-interpolated into the script
      # body — a dispatch input expanded inline is a shell-injection surface.
      - name: Check stage selection
        id: sel
        env:
          STAGES: ${{ inputs.stages }}
          STAGE: ${{ matrix.stage }}
        run: |
          NUM="${STAGE:10:2}"
          MODEL="${STAGE:13}"
          SELECTED=true
          if [ -n "${STAGES}" ]; then
            SELECTED=false
            for want in ${STAGES}; do
              if [ "${want}" = "${NUM}" ] || [ "${want}" = "${MODEL}" ] || [ "${want}" = "${STAGE}" ]; then
                SELECTED=true
              fi
            done
          fi
          echo "selected=${SELECTED}" >> "$GITHUB_OUTPUT"
          echo "stage ${STAGE}: selected=${SELECTED}"

      - name: Checkout nfl-data
        if: steps.sel.outputs.selected == 'true'
        uses: actions/checkout@v5
        with:
          path: nfl-data
          # Nothing here runs an authenticated git operation — publishing uses
          # secrets.SDV_GH_TOKEN in the publish job — so the job token has no
          # reason to sit in the checkout's git config.
          persist-credentials: false

      - name: Set up Python 3.12
        if: steps.sel.outputs.selected == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.sel.outputs.selected == 'true'
        uses: astral-sh/setup-uv@v8.1.0

      - name: Sync nfl-data Python deps
        if: steps.sel.outputs.selected == 'true'
        working-directory: nfl-data
        run: uv sync --frozen

      # sportsdataverse from git main. --reinstall --refresh is REQUIRED:
      # `uv sync --frozen` already installed the lockfile-pinned release and a
      # plain install no-ops against a satisfied environment. Every `uv run`
      # below passes --no-sync so this is not undone.
      - name: Install sportsdataverse from git (main)
        if: steps.sel.outputs.selected == 'true'
        working-directory: nfl-data
        run: |
          uv pip install --reinstall --refresh \
            "sportsdataverse @ git+https://github.com/sportsdataverse/sportsdataverse-py.git@main"

      # Fail in seconds on a broken surface rather than after a multi-hour fit.
      - name: Verify trainer surface imports
        if: steps.sel.outputs.selected == 'true'
        working-directory: nfl-data/python
        run: |
          uv run --no-sync --project .. python -c "import model_training.play_level, model_training.decision_models; print('trainer surface OK')"

      - name: Run stage
        if: steps.sel.outputs.selected == 'true'
        working-directory: nfl-data/python
        env:
          NROUNDS: ${{ inputs.nrounds }}
          STAGE: ${{ matrix.stage }}
        run: |
          EXTRA=""
          case "${STAGE}" in
            nfl_model_0[6-9]_*|nfl_model_1[01]_*)
              if [ -n "${NROUNDS}" ]; then EXTRA="--nrounds ${NROUNDS}"; fi
              ;;
          esac
          uv run --no-sync --project .. python -m "${STAGE}" ${EXTRA}

      # Retained even when publishing is off, so a retrain can be inspected and
      # compared against the released models before anyone overwrites them.
      - name: Upload stage artifact
        if: steps.sel.outputs.selected == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nfl-model-${{ matrix.stage }}
          path: |
            nfl-data/python/models/*.ubj
            nfl-data/python/models/*.json
            nfl-data/python/out/**
            nfl-data/models/ledger.jsonl
          if-no-files-found: warn
          retention-days: 30

  # Publish is opt-in and the ONLY job given the cross-repo PAT, so training
  # never has it in scope. needs.stage.result is the matrix aggregate — any
  # selected stage failing blocks publish.
  publish:
    name: Publish artifacts (opt-in)
    needs: stage
    if: ${{ !cancelled() && inputs.publish && needs.stage.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout nfl-data
        uses: actions/checkout@v5
        with:
          path: nfl-data
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Sync nfl-data Python deps
        working-directory: nfl-data
        run: uv sync --frozen

      - name: Download stage artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: nfl-model-*
          merge-multiple: true
          path: nfl-data/python

      - name: Publish play-level artifacts
        working-directory: nfl-data/python
        env:
          GITHUB_TOKEN: ${{ secrets.SDV_GH_TOKEN }}
        run: |
          if ls models/*.ubj >/dev/null 2>&1; then
            uv run --no-sync --project .. python -m nfl_model_publish artifacts \
              --models models \
              --tag nfl_model_artifacts
          else
            echo "no play-level artifacts in this run — skipping"
          fi

      # Release-mapped routing; NEVER the generic `artifacts` subcommand here.
      - name: Publish decision-model artifacts (release-mapped)
        working-directory: nfl-data/python
        env:
          GITHUB_TOKEN: ${{ secrets.SDV_GH_TOKEN }}
        run: |
          if ls out/* >/dev/null 2>&1; then
            uv run --no-sync --project .. python -m nfl_model_publish decision_models-artifacts \
              --out-dir out
          else
            echo "no decision-model artifacts in this run — skipping"
          fi
