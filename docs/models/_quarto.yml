project:
  type: website
  output-dir: _site

website:
  title: "NFL Models"
  description: >-
    Model cards for the SportsDataverse / nflverse NFL models (EP, WP, CP/CPOE,
    xYAC, the fourth-down decision suite, xPass, QBR, dakota) — recipe, features,
    calibration, nflfastR parity, and limitations for each.
  navbar:
    background: "#013369"
    left:
      - href: index.qmd
        text: Home
  sidebar:
    style: docked
    contents:
      - index.qmd
      - parity.qmd
      - section: "Core play-level models"
        contents:
          - ep.qmd
          - wp_spread.qmd
          - wp_naive.qmd
          - cpoe.qmd
      - section: "Yards after catch"
        contents:
          - xyac.qmd
      - section: "Fourth-down decision"
        contents:
          - fourth_down.qmd
          - fg.qmd
          - two_pt.qmd
          - punt.qmd
          - nfl4th_wp.qmd
      - section: "Tendency & quarterback efficiency"
        contents:
          - xpass.qmd
          - qbr.qmd
          - dakota.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
