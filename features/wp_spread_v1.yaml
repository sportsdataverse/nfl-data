# Feature set v1 for `wp_spread` — generated from the code constant;
# ordered equality with the constant is gated by tests/test_feature_sets.py.
# The constant is still the authority (migration step 2 of 3); inverting the
# dependency (code reads this file) is a recorded follow-up.
model: wp_spread
version: 1
source_constant: model_training.play_level.constants.WP_SPREAD_FEATURES
hyperparams_constant: model_training.play_level.constants.WP_SPREAD_HYPERPARAMS
columns:
- receive_2h_ko
- spread_time
- home
- half_seconds_remaining
- game_seconds_remaining
- Diff_Time_Ratio
- score_differential
- down
- ydstogo
- yardline_100
- posteam_timeouts_remaining
- defteam_timeouts_remaining
# Fitted constant the derived columns above (spread_time, Diff_Time_Ratio) are
# built with. Equality with the code constant AND the sdv-py applier is gated by
# tests/test_feature_sets.py; the trainer writes the same value into the model
# card (derived_feature_constants.spread_time_decay_exponent).
derived_constants:
  spread_time_decay_exponent: -4.0
  source_constant: model_training.play_level.constants.SPREAD_TIME_DECAY_EXPONENT
