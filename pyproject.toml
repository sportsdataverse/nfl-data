[project]
name = "nfl-data-pipeline"
version = "0.1.0"
description = "Builds NFL compiled play-by-play datasets + trains EP/WP/CP models from sportsdataverse/nfl-raw committed JSON; publishes to sportsdataverse-data."
requires-python = ">=3.11"
dependencies = [
    "sportsdataverse @ git+https://github.com/sportsdataverse/sportsdataverse-py@main",
    "polars>=1.0,<2.0",
    "pyarrow>=15.0",
    "requests>=2.28",
    "tqdm>=4.66",
    "xgboost>=2.0",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
figures = ["plotnine>=0.13", "scikit-misc>=0.3"]

[tool.pytest.ini_options]
markers = [
    "integration: whole-corpus or network test requiring fetched/cached JSON (deselected by default)",
]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = '-m "not integration"'

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned rule set: relying on ruff defaults makes the gate version-sensitive.
select = ["E4", "E7", "E9", "F", "I"]
# Explicit polars bool masks (pl.col(...) == True) are the project convention.
ignore = ["E712"]
